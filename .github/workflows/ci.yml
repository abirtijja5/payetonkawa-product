# CI/CD du micro-service product (dépôt payetonkawa-product)
# Déclenchée à chaque push et pull request (GitFlow : main, develop, feature/*, release/*, hotfix/*).
name: CI/CD product

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/payetonkawa-product

jobs:
  # 1. Qualité du code + tests unitaires et d'intégration
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      - name: Style du code (flake8)
        run: flake8 .
      - name: Configuration Django et migrations à jour
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Tests + couverture (minimum 95 %)
        run: |
          coverage run manage.py test --verbosity 2
          coverage report --fail-under=95
          coverage xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  # 2. Sécurité (référentiel OWASP Top 10)
  securite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit pip-audit
      - name: Failles dans le code (Bandit - SAST)
        run: bandit -r . -x "./*/tests.py,./*/migrations" -ll
      - name: Dépendances vulnérables (pip-audit - OWASP A06)
        run: pip-audit -r requirements.txt

  # 3. Qualité et dette technique (SonarCloud), si la variable SONAR_ENABLED vaut true
  sonar:
    runs-on: ubuntu-latest
    needs: tests
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: coverage
      - uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # 4. Image Docker : construite à chaque fois, publiée sur develop, main et les tags
  docker:
    runs-on: ubuntu-latest
    needs: [tests, securite]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Connexion au registre GitHub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
